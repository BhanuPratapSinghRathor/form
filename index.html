<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoMela - Lead Registration</title>
  <script src="https://google.com"></script>
  <script>
    function timestamp() {
      var response = document.getElementById("g-recaptcha-response");
      if (response == null || response.value.trim() == "") {
        var elems = JSON.parse(document.getElementsByName("captcha_settings")[0].value);
        elems["ts"] = JSON.stringify(new Date().getTime());
        document.getElementsByName("captcha_settings")[0].value = JSON.stringify(elems);
      }
    }
    setInterval(timestamp, 500);
  </script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .form-card { background: #ffffff; padding: 32px; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); width: 100%; max-width: 440px; }
    h2 { margin-top: 0; color: #16325c; font-size: 22px; text-align: center; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #3e3e3c; }
    input[type="text"], input[type="email"], select {
      width: 100%; padding: 10px 12px; margin-bottom: 16px; border: 1px solid #dddbda;
      border-radius: 6px; font-size: 14px; background: #fff;
    }
    input:focus, select:focus { outline: none; border-color: #0176d3; box-shadow: 0 0 0 2px rgba(1,118,211,0.2); }
    .g-recaptcha { margin-bottom: 18px; }
    input[type="submit"] {
      width: 100%; padding: 12px; background: #0176d3; color: #ffffff; border: none;
      border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    input[type="submit"]:hover { background: #014486; }
  </style>
</head>
<body>

  <div class="form-card">
    <h2>AutoMela Inquiry</h2>

    <form action="https://salesforce.com" method="POST">

      <input type="hidden" name="captcha_settings" value='{"keyname":"AutoMela","fallback":"true","orgId":"00Dbm000014peTd","ts":""}'>
      <input type="hidden" name="oid" value="00Dbm000014peTd">
      <input type="hidden" name="retURL" value="https://salesforce.com">

      <!-- Optional Debug Mode: Uncomment the 2 lines below to receive email alerts if a submission fails -->
      <!-- <input type="hidden" name="debug" value="1"> -->
      <!-- <input type="hidden" name="debugEmail" value="bhanubpsr13@gmail.com"> -->

      <label for="first_name">First Name</label>
      <input id="first_name" maxlength="40" name="first_name" type="text" required />

      <label for="last_name">Last Name</label>
      <input id="last_name" maxlength="80" name="last_name" type="text" required />

      <label for="email">Email</label>
      <input id="email" maxlength="80" name="email" type="email" required />

      <label for="company">Company</label>
      <input id="company" maxlength="40" name="company" type="text" required />

      <label for="city">City</label>
      <input id="city" maxlength="40" name="city" type="text" />

      <label for="country_code">Country</label>
      <select id="country_code" name="country_code">
        <option value="">--None--</option>
        <option value="IN">India</option>
        <option value="US">United States</option>
        <option value="GB">United Kingdom</option>
        <option value="AE">United Arab Emirates</option>
        <option value="AU">Australia</option>
        <option value="CA">Canada</option>
        <option value="DE">Germany</option>
        <option value="SG">Singapore</option>
      </select>

      <!-- Replace YOUR_RECAPTCHA_SITE_KEY below with the data-sitekey value from your Salesforce snippet -->
      <div class="g-recaptcha" data-sitekey="YOUR_RECAPTCHA_SITE_KEY"></div>

      <input type="submit" name="submit" value="Submit">

    </form>
  </div>

</body>
</html>
